# 放到仓库 .github/workflows/loadtest.yml
# 手动触发: 仓库 Actions 页 -> Load Test -> Run workflow
name: Load Test
on:
  workflow_dispatch:      # 只允许手动触发，防止误跑

jobs:
  k6:
    runs-on: ubuntu-latest   # 公开仓库免费
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run crash test
        run: k6 run sparrowzoo_crash_test.js
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: /tmp/k6_summary.json
